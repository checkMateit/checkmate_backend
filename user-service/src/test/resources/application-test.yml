# user-service 테스트 전용 설정
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  datasource:
    url: jdbc:h2:mem:user_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  jackson:
    serialization:
      write-dates-as-timestamps: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# JWT 테스트용 (HS256 최소 32자)
jwt:
  secret: "test-jwt-secret-for-user-service-256bits!!"
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000
