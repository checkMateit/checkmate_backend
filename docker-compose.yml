version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: checkmate-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always 
  
  postgres:
    image: postgres:latest
    container_name: sample-postgres
    ports:
      - 5432:5432
    environment:
      - POSTGRES_DB=sample
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes:
      - ./postgres-data:/var/lib/postgresql

volumes:
  redis_data:
