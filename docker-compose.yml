version: '3.8'

services:
  eureka-service:
    build:
      context: .
      dockerfile: eureka-service/Dockerfile
    container_name: eureka-service
    ports:
      - "8761:8761"
    networks:
      - checkmate-network

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://sample-postgres:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_REDIS_HOST=redis-cache
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXPIRATION=${JWT_ACCESS_EXPIRATION}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION}
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-service:8761/eureka/
    depends_on:
      - postgres
      - redis
      - eureka-service
    networks:
      - checkmate-network

  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    container_name: gateway-service
    ports:
      - "8000:8000"
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-service:8761/eureka/
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXPIRATION=${JWT_ACCESS_EXPIRATION}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION}
    depends_on:
      - eureka-service
    networks:
      - checkmate-network

  redis:
    image: redis:7-alpine
    container_name: checkmate-redis
    ports:
      - "${REDIS_LOCAL_PORT}:${REDIS_PORT}"
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - checkmate-network
  
  postgres:
    image: postgres:latest
    container_name: sample-postgres
    ports:
      - ${DB_LOCAL_PORT}:${DB_PORT}
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./postgres-data:/var/lib/postgresql
    networks:
      - checkmate-network

volumes:
  redis_data:

networks:
  checkmate-network:
    driver: bridge